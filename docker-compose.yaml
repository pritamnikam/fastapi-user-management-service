version: "3.8"
services:
  web:
    build: .
    ports:
      - "8000:80"
      - "8501:8501"
    environment:
      - DB_USER=admin
      - DB_PASSWORD=secret
      - DB_NAME=prompt_catalog
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      - db
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: prompt_catalog
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata: