[project]
name = "ai-prompt-catalog"
version = "0.1.0"
description = "A FastAPI backend for managing and externalizing LLM prompts with PostgreSQL."
authors = ["Pritam Nikam <pritam.nikam@gmail.com>"]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.118.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
    "pydantic-settings>=2.0.0",
    "streamlit>=1.32.0",
    "pandas>=2.0.0"
]

[tool.pytest.ini_options]
pythonpath = "."